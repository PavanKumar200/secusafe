<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Security Scanner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f1a;
      width: 320px;
      min-height: 200px;
      color: #e2e8f0;
    }

    .popup-header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px;
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .popup-logo { font-size: 1.4rem; }
    .popup-title { font-size: 0.95rem; font-weight: 700; color: #a5b4fc; }
    .popup-sub   { font-size: 0.72rem; color: #6b7280; margin-top: 1px; }

    .popup-body { padding: 16px; }

    /* Loading state */
    .loading-state {
      text-align: center; padding: 32px 16px; color: #6b7280;
    }
    .spinner {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid #2d2d4e; border-top-color: #4f46e5;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* No data state */
    .no-data {
      text-align: center; padding: 28px 16px;
      color: #6b7280; font-size: 0.85rem; line-height: 1.6;
    }
    .no-data .icon { font-size: 2rem; margin-bottom: 8px; }

    /* Risk score */
    .risk-card {
      border-radius: 12px; padding: 16px;
      margin-bottom: 12px;
    }
    .risk-card.low      { background: #052e16; border: 1px solid #166534; }
    .risk-card.medium   { background: #1c1400; border: 1px solid #854d0e; }
    .risk-card.high     { background: #1c0707; border: 1px solid #991b1b; }
    .risk-card.critical { background: #120303; border: 1px solid #7c1e1e; }

    .risk-row { display: flex; justify-content: space-between; align-items: center; }

    .risk-score-text {
      font-size: 2.4rem; font-weight: 900; letter-spacing: -0.04em;
    }
    .low .risk-score-text      { color: #4ade80; }
    .medium .risk-score-text   { color: #fbbf24; }
    .high .risk-score-text     { color: #f87171; }
    .critical .risk-score-text { color: #fca5a5; }

    .risk-level-badge {
      font-size: 0.78rem; font-weight: 700; padding: 4px 12px;
      border-radius: 999px;
    }
    .low .risk-level-badge      { background: #14532d; color: #4ade80; }
    .medium .risk-level-badge   { background: #451a03; color: #fbbf24; }
    .high .risk-level-badge     { background: #450a0a; color: #f87171; }
    .critical .risk-level-badge { background: #3b0505; color: #fca5a5; }

    .risk-url {
      font-size: 0.72rem; color: #6b7280; margin-top: 6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Warnings */
    .warnings-section { margin-bottom: 12px; }
    .warnings-title { font-size: 0.78rem; font-weight: 700; color: #9ca3af; margin-bottom: 8px; }
    .warning-item {
      font-size: 0.76rem; color: #d1d5db; padding: 6px 10px;
      background: #1e1e2e; border-radius: 6px; margin-bottom: 4px;
      border-left: 3px solid #f59e0b;
      line-height: 1.4;
    }

    /* Full report link */
    .full-report-link {
      display: block; text-align: center; padding: 10px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff; text-decoration: none; border-radius: 8px;
      font-size: 0.82rem; font-weight: 700;
      transition: opacity 0.2s;
    }
    .full-report-link:hover { opacity: 0.9; }

    .scan-time {
      text-align: center; font-size: 0.68rem; color: #4b5563; margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="popup-header">
    <div class="popup-logo">🔒</div>
    <div>
      <div class="popup-title">Security Scanner</div>
      <div class="popup-sub">Real-time threat detection</div>
    </div>
  </div>

  <div class="popup-body">
    <!-- Injected by popup.js -->
    <div id="popup-content">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Loading scan result...</p>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
